# ===================================================================
# Placement Preparation Portal - Application Configuration
# ===================================================================
server.port=8080

# Application Name
spring.application.name=placement-portal

# Default Database: In-memory H2 database (Runs instantly with zero setup for demo & viva)
spring.datasource.url=jdbc:h2:mem:placementdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Disable automatic sql script execution on H2 so schema.sql is reserved for MySQL
spring.sql.init.mode=never

# H2 Console (Access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JSON Formatting
spring.jackson.serialization.indent-output=true

# -------------------------------------------------------------------
# To connect to a local MySQL Database:
# Run application with `--spring.profiles.active=mysql` or edit application-mysql.properties
# -------------------------------------------------------------------
