# ===================================================================
# Placement Preparation Portal - MySQL Production Profile
# Activate via: java -jar target/placement-portal-1.0.0.jar --spring.profiles.active=mysql
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/placement_portal_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
